<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">AI Tool Radar Agent Run Demo Snapshot</title>
  <desc id="desc">A preview of an AI coding agent running a terminal workflow, validating a repo, building the site, and preparing a pull request.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfcf8"/>
      <stop offset="1" stop-color="#e7f0ea"/>
    </linearGradient>
    <linearGradient id="progress" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d766d"/>
      <stop offset="1" stop-color="#bd7c1f"/>
    </linearGradient>
    <filter id="shadow" x="-12%" y="-18%" width="124%" height="136%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#1f2d27" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#page)"/>
  <rect x="68" y="58" width="1144" height="604" rx="18" fill="#ffffff" opacity="0.74"/>

  <text x="94" y="118" fill="#084f49" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" letter-spacing="1.6">AGENT RUN</text>
  <text x="94" y="176" fill="#15211d" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="850">From launch signal to shipped experiment</text>
  <text x="96" y="218" fill="#5d6b64" font-family="Inter, Arial, sans-serif" font-size="22">A scoped AI coding-agent task moves from prompt to tested pull request.</text>

  <g filter="url(#shadow)">
    <rect x="94" y="270" width="650" height="350" rx="10" fill="#111b18"/>
    <rect x="94" y="270" width="650" height="48" rx="10" fill="#16241f"/>
    <rect x="94" y="308" width="650" height="12" fill="#16241f"/>
    <circle cx="126" cy="294" r="7" fill="#d86464"/>
    <circle cx="149" cy="294" r="7" fill="#d8a244"/>
    <circle cx="172" cy="294" r="7" fill="#49b87c"/>

    <text x="126" y="362" fill="#ffffff" font-family="SFMono-Regular, Consolas, monospace" font-size="22">$ codex "Add Grok Build to AI Tool Radar"</text>
    <text x="126" y="414" fill="#d6f5e8" font-family="SFMono-Regular, Consolas, monospace" font-size="22"><tspan fill="#6ee7b7" font-weight="800">✓</tspan> Reading repo structure</text>
    <text x="126" y="458" fill="#d6f5e8" font-family="SFMono-Regular, Consolas, monospace" font-size="22"><tspan fill="#6ee7b7" font-weight="800">✓</tspan> Updating src/data/tools.json</text>
    <text x="126" y="502" fill="#d6f5e8" font-family="SFMono-Regular, Consolas, monospace" font-size="22"><tspan fill="#6ee7b7" font-weight="800">✓</tspan> Running data validation</text>
    <text x="126" y="546" fill="#d6f5e8" font-family="SFMono-Regular, Consolas, monospace" font-size="22"><tspan fill="#6ee7b7" font-weight="800">✓</tspan> Running tests and building dist</text>
    <text x="126" y="590" fill="#d6f5e8" font-family="SFMono-Regular, Consolas, monospace" font-size="22"><tspan fill="#6ee7b7" font-weight="800">✓</tspan> Pull request ready for review</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="792" y="270" width="390" height="84" rx="10" fill="#ffffff" stroke="#dbe2d9"/>
    <text x="818" y="302" fill="#084f49" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="850" letter-spacing="1.2">ISSUE</text>
    <text x="818" y="332" fill="#15211d" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">Add new AI launch</text>

    <rect x="815" y="374" width="3" height="34" rx="2" fill="#0d766d"/>

    <rect x="792" y="426" width="390" height="84" rx="10" fill="#ffffff" stroke="#dbe2d9"/>
    <text x="818" y="458" fill="#084f49" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="850" letter-spacing="1.2">EVIDENCE</text>
    <text x="818" y="488" fill="#15211d" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">Validate · Test · Build</text>

    <rect x="815" y="530" width="3" height="34" rx="2" fill="#0d766d"/>

    <rect x="792" y="582" width="390" height="84" rx="10" fill="#ffffff" stroke="#dbe2d9"/>
    <text x="818" y="614" fill="#084f49" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="850" letter-spacing="1.2">HANDOFF</text>
    <text x="818" y="644" fill="#15211d" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">Reviewable PR</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="792" y="128" width="390" height="112" rx="10" fill="#ffffff" stroke="#0d766d" stroke-opacity="0.34"/>
    <rect x="818" y="154" width="86" height="30" rx="15" fill="#d8f3ee"/>
    <text x="836" y="174" fill="#084f49" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="850">Early beta</text>
    <text x="818" y="214" fill="#15211d" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="850">Grok Build</text>
    <rect x="818" y="224" width="318" height="8" rx="4" fill="url(#progress)"/>
  </g>
</svg>
